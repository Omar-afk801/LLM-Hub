name: Build Universal APK
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses
        # This automatically types "y" to accept the NDK and SDK licenses required by the project
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew
        working-directory: ./android

      - name: Build Debug APK with Memory Limits
        run: ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" --no-daemon
        working-directory: ./android

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
