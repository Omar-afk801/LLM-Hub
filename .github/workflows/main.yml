name: Build and Release Universal APK
on: 
  workflow_dispatch: # Keeps the manual run button just in case
  push:
    tags:
      - 'v*' # Triggers automatically whenever you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Gives GitHub Actions permission to create releases and upload files
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew
        working-directory: ./android

            # === FIX: Completely rewrite BillingManager to ignore Google Play ===
      - name: Force Unlock Premium and Strip Play Billing Dependencies
        run: |
          FILE_PATH=$(find . -name "BillingManager.kt")
          if [ -f "$FILE_PATH" ]; then
            echo "Rewriting BillingManager.kt..."
            cat << 'EOF' > "$FILE_PATH"
            package com.llmhub.llmhub.billing

            import android.app.Activity
            import android.content.Context
            import android.util.Log
            import kotlinx.coroutines.*
            import kotlinx.coroutines.flow.*

            class BillingManager(private val context: Context) {
                companion object {
                    const val PRODUCT_PREMIUM_LIFETIME = "premium_lifetime"
                    private const val TAG = "BillingManager"
                }

                private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
                private val _isPremium = MutableStateFlow(true)
                val isPremium: StateFlow<Boolean> = _isPremium.asStateFlow()

                private val _productPrice = MutableStateFlow<String?>("$0.00")
                val productPrice: StateFlow<String?> = _productPrice.asStateFlow()

                init {
                    Log.d(TAG, "DUMMY_BILLING: Premium forced to true. Play services bypassed.")
                }

                fun connectAndQuery() {}
                suspend fun queryProductDetails() {}
                suspend fun restorePurchases() {}
                suspend fun restorePurchasesFromServer(): Boolean { return true }
                private suspend fun restorePurchasesInternal() {}
                fun launchPurchaseFlow(activity: Activity) {}
                private suspend fun handlePurchase(purchase: Any) {}
                private suspend fun acknowledgeIfNeeded(purchase: Any) {}
                private suspend fun setPremium(premium: Boolean) {}
                fun destroy() { scope.cancel() }
            }
            EOF
          else
            echo "Error: Could not locate BillingManager.kt!" && exit 1
          fi


      - name: Build Debug APK with Memory Limits
        run: ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" --no-daemon
        working-directory: ./android

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # Only runs this step if it was triggered by a tag push
        with:
          files: '**/build/outputs/apk/debug/*.apk'
          name: Release ${{ github.ref_name }}
          body: |
            Automated standalone universal APK release for ${{ github.ref_name }}.
            Compiled securely via GitHub Actions with premium features unlocked.
          draft: false
          prerelease: false
          

