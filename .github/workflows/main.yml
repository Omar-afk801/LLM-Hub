name: Build and Release Universal APK
on: 
  workflow_dispatch: # Keeps the manual run button just in case
  push:
    tags:
      - 'v*' # Triggers automatically whenever you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Gives GitHub Actions permission to create releases and upload files
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew
        working-directory: ./android

      - name: Build Debug APK with Memory Limits
        run: ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" --no-daemon
        working-directory: ./android

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # Only runs this step if it was triggered by a tag push
        with:
          files: '**/build/outputs/apk/debug/*.apk'
          name: Release ${{ github.ref_name }}
          body: |
            Automated standalone universal APK release for ${{ github.ref_name }}.
            Compiled securely via GitHub Actions.
          draft: false
          prerelease: false
